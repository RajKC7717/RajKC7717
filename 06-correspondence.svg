<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The Current Season">
  <rect width="1200" height="460" fill="#f4ead5"></rect>
  <text x="60" y="76" font-family="Georgia, serif" font-style="italic" font-size="48" fill="#2b2118"><tspan fill="#a35a3a">❦ </tspan>The Current Season</text>

  
  <g transform="translate(60,150)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="12" fill="#a35a3a" letter-spacing="3">SOWN THIS QUARTER</text>
    <text x="0" y="36" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#2b2118">✦ Now Growing</text>
    <g font-family="Georgia, serif" font-size="18" fill="#2b2118">
      <text x="0" y="84">Working on <tspan font-weight="bold">myself</tspan> — sharpening taste, deepening</text>
      <text x="0" y="110">craft, planting projects that compound.</text>
      <text x="0" y="136" fill="#5a4b3c" font-style="italic">Less noise. More rings on the trunk.</text>
    </g>
    <g font-family="ui-monospace, monospace" font-size="14" fill="#2b2118">
      <text x="0" y="190">sowing  ………  new patterns in React</text>
      <text x="0" y="218">tending  ……  a Node + Postgres patch</text>
      <text x="0" y="246">pruning  …  the parts that don&#39;t matter</text>
    </g>
  </g>

  
  <g transform="translate(660,150)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="12" fill="#a35a3a" letter-spacing="3">STAMPED &amp; DATED</text>
    <text x="0" y="36" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#2b2118">✦ Posted Notices</text>
    <g font-family="ui-monospace, monospace" font-size="16" fill="#2b2118">
      <text x="0" y="84">☐   Open to full-time roles</text>
      <text x="0" y="116">☐   Open to freelance briefs</text>
      <text x="0" y="148">☐   Open to collaborative side-projects</text>
      <text x="20" y="172">with strong design conviction</text>
    </g>
    <text x="0" y="234" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#5a4b3c">Reply postmarked with care to the address at the foot of the page.</text>
  </g>
</svg>